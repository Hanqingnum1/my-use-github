<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的物品归档</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 主页界面 -->
        <div id="home-page">
        <h1>我的物品库</h1>
        <!-- 点击“物品”直接触发新增物品的表单 -->
        <button class="main-btn" onclick="showAddForm()">物品</button>
        <button class="main-btn" onclick="showDistribution()">物品分布</button>
        <button class="main-btn">全部物品</button>
    </div>

    <!-- 增加物品的界面（先隐藏，点击按钮才显示） -->
    <div id="add-form" style="display: none;">
        <h2>增加物品</h2>
        
        <label>上传图片（支持拍照/相册）：</label>
        <input type="file" accept="image/*" capture="camera">
        <br><br>

        <label>物品分类：</label>
        <select id="category" onchange="toggleWarranty()">
            <option value="">请选择</option>
            <option value="家电">家电</option>
            <option value="电子产品">电子产品</option>
            <option value="食品">食品</option>
            <option value="护肤品">护肤品</option>
            <option value="化妆品">化妆品</option>
            <option value="生活用品">生活用品</option>
            <option value="书本">书本</option>
            <option value="学习资料">学习资料</option>
            <option value="手办">手办</option>
        </select>
        <br><br>

        <label>物品名称：</label>
        <input type="text" placeholder="例如：吹风机">
        <br><br>

        <label>物品价格：</label>
        <input type="number" placeholder="例如：299">
        <br><br>

        <label>物品保质期：</label>
        <input type="date">
        <br><br>

        <!-- 质保期（默认隐藏，选家电/电子产品才显示） -->
        <div id="warranty-box" style="display: none;">
            <label>物品质保期：</label>
            <input type="date">
            <br><br>
        </div>

        <button onclick="saveItem()">保存物品</button>
        <button onclick="goHome()">返回主页</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
